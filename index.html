<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify – Music for Everyone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── Login Screen ─────────────────────────────────── -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 168 168"><circle cx="84" cy="84" r="84" fill="#1ed760"/><path d="M120.4 113.3c-1.6 2.6-5 3.4-7.6 1.8-20.8-12.7-47-15.6-77.8-8.5-3 .7-6-1.1-6.7-4.1-.7-3 1.1-6 4.1-6.7 33.7-7.7 62.6-4.4 86 9.8 2.7 1.6 3.5 5 1.9 7.7zm10.1-22.5c-2 3.2-6.2 4.2-9.4 2.2-23.8-14.6-60-18.8-88.1-10.3-3.6 1.1-7.5-1-8.6-4.6-1.1-3.6 1-7.5 4.6-8.6 32.1-9.7 72-5 99.3 11.8 3.2 2 4.3 6.2 2.2 9.5zm.9-23.5C101.7 51 59.3 49.5 35.3 56.6c-4.4 1.3-9-.8-10.4-5.2-1.3-4.4.9-9 5.2-10.4 27.4-8.3 73-6.5 101.7 10.3 3.9 2.3 5.2 7.3 2.9 11.2-2.2 3.9-7.2 5.2-11.1 3l.7-.2z" fill="#000"/></svg>
      <span>Spotify</span>
    </div>
    <h1>Log in to Soptify</h1>
    <div id="loginError" class="auth-error hidden"></div>
    <input type="text" id="loginUsername" placeholder="Username" class="auth-input" />
    <input type="password" id="loginPassword" placeholder="Password" class="auth-input" />
    <button class="btn-primary btn-full" onclick="login()">Log In</button>
    <div class="auth-divider"><span>or</span></div>
    <button class="btn-outline btn-full" onclick="showRegister()">Sign Up</button>
    <p class="auth-hint">Demo: <strong>demo</strong> / <strong>demo123</strong></p>
  </div>
</div>

<!-- ─── Register Screen ──────────────────────────────── -->
<div id="registerScreen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 168 168"><circle cx="84" cy="84" r="84" fill="#1ed760"/><path d="M120.4 113.3c-1.6 2.6-5 3.4-7.6 1.8-20.8-12.7-47-15.6-77.8-8.5-3 .7-6-1.1-6.7-4.1-.7-3 1.1-6 4.1-6.7 33.7-7.7 62.6-4.4 86 9.8 2.7 1.6 3.5 5 1.9 7.7zm10.1-22.5c-2 3.2-6.2 4.2-9.4 2.2-23.8-14.6-60-18.8-88.1-10.3-3.6 1.1-7.5-1-8.6-4.6-1.1-3.6 1-7.5 4.6-8.6 32.1-9.7 72-5 99.3 11.8 3.2 2 4.3 6.2 2.2 9.5zm.9-23.5C101.7 51 59.3 49.5 35.3 56.6c-4.4 1.3-9-.8-10.4-5.2-1.3-4.4.9-9 5.2-10.4 27.4-8.3 73-6.5 101.7 10.3 3.9 2.3 5.2 7.3 2.9 11.2-2.2 3.9-7.2 5.2-11.1 3l.7-.2z" fill="#000"/></svg>
      <span>Spotify</span>
    </div>
    <h1>Create Account</h1>
    <div id="registerError" class="auth-error hidden"></div>
    <input type="text" id="regName" placeholder="Full Name" class="auth-input" />
    <input type="text" id="regUsername" placeholder="Username" class="auth-input" />
    <input type="email" id="regEmail" placeholder="Email" class="auth-input" />
    <input type="password" id="regPassword" placeholder="Password" class="auth-input" />
    <button class="btn-primary btn-full" onclick="register()">Sign Up</button>
    <div class="auth-divider"><span>or</span></div>
    <button class="btn-outline btn-full" onclick="showLogin()">Back to Log In</button>
  </div>
</div>

<!-- ─── App Shell ────────────────────────────────────── -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="28" height="28" viewBox="0 0 168 168"><circle cx="84" cy="84" r="84" fill="#1ed760"/><path d="M120.4 113.3c-1.6 2.6-5 3.4-7.6 1.8-20.8-12.7-47-15.6-77.8-8.5-3 .7-6-1.1-6.7-4.1-.7-3 1.1-6 4.1-6.7 33.7-7.7 62.6-4.4 86 9.8 2.7 1.6 3.5 5 1.9 7.7zm10.1-22.5c-2 3.2-6.2 4.2-9.4 2.2-23.8-14.6-60-18.8-88.1-10.3-3.6 1.1-7.5-1-8.6-4.6-1.1-3.6 1-7.5 4.6-8.6 32.1-9.7 72-5 99.3 11.8 3.2 2 4.3 6.2 2.2 9.5zm.9-23.5C101.7 51 59.3 49.5 35.3 56.6c-4.4 1.3-9-.8-10.4-5.2-1.3-4.4.9-9 5.2-10.4 27.4-8.3 73-6.5 101.7 10.3 3.9 2.3 5.2 7.3 2.9 11.2-2.2 3.9-7.2 5.2-11.1 3l.7-.2z" fill="#000"/></svg>
      <span>Spotify</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="navigate('home')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </a>
      <a href="#" class="nav-item" onclick="navigate('search')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Search
      </a>
      <a href="#" class="nav-item" onclick="navigate('library')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
        Your Library
      </a>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="sidebar-playlists">
      <div class="sidebar-section-header">
        <span>PLAYLISTS</span>
        <button class="icon-btn" onclick="createPlaylist()">+</button>
      </div>
      <div id="sidebarPlaylists"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">D</div>
        <span id="userName">User</span>
      </div>
      <button class="icon-btn logout-btn" onclick="logout()" title="Logout">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-nav">
        <button class="nav-arrow" onclick="history.back()">‹</button>
        <button class="nav-arrow" onclick="history.forward()">›</button>
      </div>
      <div class="search-bar" id="searchBar" style="display:none;">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Artists, songs, or podcasts" oninput="debounceSearch(this.value)" />
      </div>
    </div>

    <!-- Home View -->
    <div id="homeView" class="view active">
      <div class="view-header gradient-header">
        <h1>Good evening 👋</h1>
      </div>
      <div class="view-body">
        <section>
          <div class="section-header"><h2>Trending Now</h2></div>
          <div class="grid-4" id="trendingGrid"></div>
        </section>
        <section>
          <div class="section-header"><h2>Featured Playlists</h2></div>
          <div class="grid-4" id="featuredPlaylists"></div>
        </section>
        <section>
          <div class="section-header"><h2>New Albums</h2></div>
          <div class="grid-4" id="albumsGrid"></div>
        </section>
      </div>
    </div>

    <!-- Search View -->
    <div id="searchView" class="view">
      <div class="view-body" style="padding-top: 20px;">
        <div id="searchResults">
          <div class="browse-grid" id="browseCategories"></div>
        </div>
      </div>
    </div>

    <!-- Library View -->
    <div id="libraryView" class="view">
      <div class="view-header"><h1>Your Library</h1></div>
      <div class="view-body">
        <section>
          <div class="section-header"><h2>Liked Songs</h2>
            <span id="likedCount" class="count-badge">0</span>
          </div>
          <div id="likedSongsList"></div>
        </section>
        <section>
          <div class="section-header"><h2>Your Playlists</h2>
            <button class="btn-sm btn-green" onclick="createPlaylist()">+ New Playlist</button>
          </div>
          <div class="grid-4" id="userPlaylists"></div>
        </section>
      </div>
    </div>

    <!-- Playlist View -->
    <div id="playlistView" class="view">
      <div class="playlist-header" id="playlistHeader"></div>
      <div class="view-body">
        <div id="playlistSongs"></div>
      </div>
    </div>

    <!-- Album View -->
    <div id="albumView" class="view">
      <div class="playlist-header" id="albumHeader"></div>
      <div class="view-body">
        <div id="albumSongs"></div>
      </div>
    </div>
  </main>
</div>

<!-- ─── Player Bar ────────────────────────────────────── -->
<div class="player-bar" id="playerBar">
  <div class="player-left">
    <img id="playerCover" src="" alt="" class="player-cover" />
    <div class="player-info">
      <div class="player-title" id="playerTitle">Select a song</div>
      <div class="player-artist" id="playerArtist">—</div>
    </div>
    <button class="player-like-btn" id="playerLikeBtn" onclick="toggleLike()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="prevSong()" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" width="24" height="24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextSong()" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repeat">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="progress-bar-area">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-track" onclick="seek(event)">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <span class="time-label" id="totalTime">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
  </div>
</div>

<audio id="audioPlayer"></audio>
<script src="app.js"></script>
</body>
</html>
